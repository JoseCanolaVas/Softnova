server {
    listen 80;
    server_name 200.234.233.146;
    client_max_body_size 100M;
    location = / { return 302 /login; }
    location = /modulo-parametrizacion { return 302 /modulo-parametrizacion/productos; }
    location = /modulo-parametrizacion/ { return 302 /modulo-parametrizacion/productos; }
    location ~ ^/(?:index(?:\.html)?|dashboard|panel|categorias|catalogo|inspire)(?:/|$) { return 404; }
    location ~ ^/modulo-parametrizacion/(?:categorias|index(?:\.html)?|dashboard|panel)(?:/|$) { return 404; }
    location /api/ {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 120;
    }
    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
