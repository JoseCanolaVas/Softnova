name: softnova-parametrizacion
services:
  database:
    image: postgres:16-alpine
    env_file: ../../env/database.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
  backend:
    image: softnova-parametrizacion-api:local
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    env_file: ../../env/backend.env
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    image: softnova-parametrizacion-frontend:local
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        API_URL: /api
        BACKEND_URL: http://200.234.233.146
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/server.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/backend/storage:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  backend_storage:
